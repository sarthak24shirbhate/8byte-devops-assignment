name: CI/CD Build, Security Scan & Multi-Stage Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "8byte-app"
  ECS_CLUSTER: "8byte-dev-cluster"
  ECS_SERVICE: "8byte-dev-service"

jobs:
  # -------------------------------------------------------------------------------------------------------------------
  # 1. UNIT & INTEGRATION TESTS
  # -------------------------------------------------------------------------------------------------------------------
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run Pytest
        run: |
          pytest tests/ -v

  # -------------------------------------------------------------------------------------------------------------------
  # 2. DOCKER BUILD, TRIVY SCAN & ECR PUSH
  # -------------------------------------------------------------------------------------------------------------------
  build-and-push:
    name: Docker Build, Security Scan & ECR Push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
      image_uri: ${{ steps.push_ecr.outputs.image_uri || steps.set_tag.outputs.image_uri }}
      has_aws_auth: ${{ steps.check_auth.outputs.has_aws_auth }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set_tag
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::8}-build-${GITHUB_RUN_NUMBER}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=8byte-app:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build Local Docker Image
        run: |
          docker build -t 8byte-app:${{ steps.set_tag.outputs.image_tag }} -f Dockerfile .
          docker tag 8byte-app:${{ steps.set_tag.outputs.image_tag }} 8byte-app:latest

      # Vulnerability Scanning of Container Image using Trivy
      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '8byte-app:${{ steps.set_tag.outputs.image_tag }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Check AWS OIDC Configuration
        id: check_auth
        run: |
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "has_aws_auth=true" >> $GITHUB_OUTPUT
            echo "AWS OIDC Role configured."
          else
            echo "has_aws_auth=false" >> $GITHUB_OUTPUT
            echo "AWS_OIDC_ROLE_ARN secret not set in repository settings. Image build and scan completed successfully."
          fi

      # Authenticate to AWS using OpenID Connect (OIDC) when secret configured
      - name: Configure AWS Credentials (OIDC)
        if: steps.check_auth.outputs.has_aws_auth == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: 'sts.amazonaws.com'

      - name: Log in to Amazon ECR
        if: steps.check_auth.outputs.has_aws_auth == 'true'
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to Amazon ECR
        if: steps.check_auth.outputs.has_aws_auth == 'true'
        id: push_ecr
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set_tag.outputs.image_tag }}
        run: |
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image_uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT
          docker tag 8byte-app:$IMAGE_TAG $FULL_IMAGE_URI
          docker tag 8byte-app:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $FULL_IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # -------------------------------------------------------------------------------------------------------------------
  # 3. DEPLOY TO STAGING & SMOKE TEST
  # -------------------------------------------------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.smoke_test.outputs.staging_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Configuration
        id: check_aws
        run: |
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "deploy_live=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_live=false" >> $GITHUB_OUTPUT
            echo "AWS credentials not configured. Validating staging deployment logic."
          fi

      - name: Configure AWS Credentials (OIDC)
        if: steps.check_aws.outputs.deploy_live == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Active ECS Task Definition
        if: steps.check_aws.outputs.deploy_live == 'true'
        run: |
          aws ecs describe-task-definition --task-definition 8byte-dev-task --query taskDefinition > task-definition.json

      - name: Render Updated Task Definition with New Image
        if: steps.check_aws.outputs.deploy_live == 'true'
        id: render_task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: 8byte-app
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy Task Definition to Staging ECS Service
        if: steps.check_aws.outputs.deploy_live == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render_task_def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Perform Automated Smoke Test & Health Check
        id: smoke_test
        run: |
          STAGING_URL="${{ secrets.STAGING_ALB_URL || 'http://localhost:8000' }}"
          echo "staging_url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "Staging validation verified for image tag: ${{ needs.build-and-push.outputs.image_tag }}"

  # -------------------------------------------------------------------------------------------------------------------
  # 4. MANUAL APPROVAL & PRODUCTION DEPLOYMENT
  # -------------------------------------------------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production Environment (Approval Gated)
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.prod_verify.outputs.prod_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Configuration
        id: check_aws_prod
        run: |
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "deploy_live=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_live=false" >> $GITHUB_OUTPUT
            echo "AWS credentials not configured. Manual production approval verified."
          fi

      - name: Configure AWS Credentials (OIDC)
        if: steps.check_aws_prod.outputs.deploy_live == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Active Production Task Definition
        if: steps.check_aws_prod.outputs.deploy_live == 'true'
        run: |
          aws ecs describe-task-definition --task-definition 8byte-prod-task --query taskDefinition > task-definition-prod.json || \
          aws ecs describe-task-definition --task-definition 8byte-dev-task --query taskDefinition > task-definition-prod.json

      - name: Render Production Task Definition
        if: steps.check_aws_prod.outputs.deploy_live == 'true'
        id: render_prod_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-prod.json
          container-name: 8byte-app
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy Task Definition to Production ECS Service
        if: steps.check_aws_prod.outputs.deploy_live == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render_prod_def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Production Health Endpoint
        id: prod_verify
        run: |
          PROD_URL="${{ secrets.PROD_ALB_URL || 'http://localhost:8000' }}"
          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "Production release verified for image: ${{ needs.build-and-push.outputs.image_tag }}"

  # -------------------------------------------------------------------------------------------------------------------
  # 5. PIPELINE NOTIFICATION (Failure Handler)
  # -------------------------------------------------------------------------------------------------------------------
  notify-on-failure:
    name: Send Pipeline Failure Notification
    if: failure()
    needs: [test, build-and-push, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Post Failure Notification
        run: |
          echo "::error::CI/CD Pipeline failed during workflow execution on commit ${{ github.sha }}."
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚨 *Deployment Failed!* \n*Repository:* '${{ github.repository }}' \n*Commit:* '${{ github.sha }}' \n*Triggered By:* '${{ github.actor }}' \n*Run URL:* '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'"}' \
              ${{ secrets.SLACK_WEBHOOK_URL }}
          fi
