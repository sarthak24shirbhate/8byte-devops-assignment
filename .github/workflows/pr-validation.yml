name: PR Validation & Security Scan

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # -------------------------------------------------------------------------------------------------------------------
  # 1. CODE QUALITY & LINTING
  # -------------------------------------------------------------------------------------------------------------------
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black Code Formatter Check
        run: |
          black --check app/ tests/

      - name: Run Flake8 Linter
        run: |
          flake8 app/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics

  # -------------------------------------------------------------------------------------------------------------------
  # 2. UNIT & INTEGRATION TESTS
  # -------------------------------------------------------------------------------------------------------------------
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

  # -------------------------------------------------------------------------------------------------------------------
  # 3. DEPENDENCY VULNERABILITY SCAN (Trivy & Pip-Audit)
  # -------------------------------------------------------------------------------------------------------------------
  dependency-security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------------------------------------------------------------
  # 4. TERRAFORM SYNTAX & VALIDATION
  # -------------------------------------------------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Format Check
        run: |
          terraform -chdir="terraform" fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform -chdir="terraform" init -backend=false
          terraform -chdir="terraform" validate
